<script>
/**
 * भारतीय मारुत केन्द्र - Smart Auto-Sync & Live Forecast Keeper
 * Automatically keeps forecast models, timeline slider, and weather layers in sync
 * when tab stays open across hours or wakes up from background sleep.
 */
(function() {
    let lastActiveTime = Date.now();
    const IDLE_THRESHOLD_MS = 25 * 60 * 1000; // 25 minutes idle
    const HEARTBEAT_INTERVAL_MS = 15 * 60 * 1000; // 15 minutes live check

    function syncForecastToNow(reason) {
        try {
            if (window.W && window.W.store) {
                const now = Date.now();
                const currentTs = window.W.store.get('timestamp');
                // If timestamp drifted away by more than 2 hours or waking from deep sleep
                if (Math.abs(now - currentTs) > 2 * 3600 * 1000) {
                    console.log('[BMK-AutoSync] Aligning timeline to current live time (' + reason + ')');
                    window.W.store.set('timestamp', now);
                    if (window.W.broadcast) {
                        window.W.broadcast.emit('timestampChanged', now);
                    }
                }
            }
        } catch (e) {
            console.warn('[BMK-AutoSync] Soft sync failed, fallback active:', e);
        }
    }

    // 1. Wakeup from Background Sleep / Tab Visibility Change
    document.addEventListener('visibilitychange', function() {
        if (!document.hidden) {
            const idleTime = Date.now() - lastActiveTime;
            lastActiveTime = Date.now();

            // If user returns after long idle (e.g. overnight or several hours)
            if (idleTime > 60 * 60 * 1000) {
                console.log('[BMK-AutoSync] Tab resumed after deep idle (' + Math.round(idleTime / 60000) + ' mins). Performing smooth live sync...');
                // Smooth soft reload to fetch fresh minifest and latest weather model run
                window.location.reload();
            } else if (idleTime > IDLE_THRESHOLD_MS) {
                syncForecastToNow('visibilitychange-idle');
            }
        } else {
            lastActiveTime = Date.now();
        }
    });

    // 2. Window Focus event (User clicks back into window)
    window.addEventListener('focus', function() {
        const idleTime = Date.now() - lastActiveTime;
        if (idleTime > IDLE_THRESHOLD_MS) {
            syncForecastToNow('window-focus');
        }
        lastActiveTime = Date.now();
    });

    // 3. Periodic Background Heartbeat (every 15 mins)
    setInterval(function() {
        if (!document.hidden) {
            syncForecastToNow('periodic-heartbeat');
        }
    }, HEARTBEAT_INTERVAL_MS);

    console.log('[BMK] Smart Auto-Sync & Live Keeper initialized');
})();
