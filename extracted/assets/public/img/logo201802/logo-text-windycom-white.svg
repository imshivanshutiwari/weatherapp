<svg width="340px" height="70px" viewBox="0 0 340 70" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <defs>
        <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.6"/>
        </filter>
        <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8"/>
            <stop offset="100%" stop-color="#0284c7"/>
        </linearGradient>
        <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fbbf24"/>
            <stop offset="100%" stop-color="#f59e0b"/>
        </linearGradient>
    </defs>
    
    <!-- Modern WeatherApp Icon -->
    <g filter="url(#logoShadow)" transform="translate(10, 8)">
        <!-- Sun -->
        <circle cx="28" cy="22" r="14" fill="url(#sunGrad)"/>
        <!-- Sun rays -->
        <path d="M 28 4 L 28 0 M 28 40 L 28 44 M 10 22 L 6 22 M 46 22 L 50 22 M 15 9 L 12 6 M 41 35 L 44 38 M 15 35 L 12 38 M 41 9 L 44 6" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
        <!-- Cloud with wind curve -->
        <path d="M 18 38 A 12 12 0 0 1 36 28 A 16 16 0 0 1 54 36 A 10 10 0 0 1 52 46 L 18 46 A 8 8 0 0 1 18 38 Z" fill="url(#cloudGrad)"/>
        <!-- Wind speed trail -->
        <path d="M 6 42 Q 14 42 22 42 M 10 46 Q 20 46 32 46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    </g>

    <!-- Clean Modern Typography -->
    <text x="75" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">
        Weather<tspan fill="#38bdf8">App</tspan>
    </text>
    <text x="235" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.5px">
        LIVE
    </text>
    <circle cx="270" cy="39" r="4" fill="#10b981"/>
</svg>
