[package]
name = "rust_server"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.7" }
tower-http = { version = "0.5", features = ["fs", "cors", "set-header", "compression-gzip", "compression-br"] }
reqwest = { version = "0.12", features = ["stream"] }
bytes = "1.7"
moka = { version = "0.12", features = ["future"] }
tracing = "0.1"
tracing-subscriber = "0.3"
http = "1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
